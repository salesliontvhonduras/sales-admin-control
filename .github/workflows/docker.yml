name: Docker image

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  APP_PATH: berry-free-react-admin-template-main/vite

jobs:
  docker:
    name: Build & publish image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
  
    env:
      VITE_APP_BASE_NAME: ${{ vars.VITE_APP_BASE_NAME || '/liontvpremium' }}
      VITE_API_AUTH: ${{ secrets.VITE_API_AUTH || vars.VITE_API_AUTH || 'https://api.liontvplus.com/sales/auth' }}
      VITE_API_USERS: ${{ secrets.VITE_API_USERS || vars.VITE_API_USERS || 'https://api.liontvplus.com/v1' }}
      VITE_API_PRODUCTS: ${{ secrets.VITE_API_PRODUCTS || vars.VITE_API_PRODUCTS || 'http://192.168.1.150:8083/v1' }}
      VITE_API_RESERVATIONS: ${{ secrets.VITE_API_RESERVATIONS || vars.VITE_API_RESERVATIONS || 'http://192.168.1.150:8084/v1' }}
      VITE_API_CATALOGS: ${{ secrets.VITE_API_CATALOGS || vars.VITE_API_CATALOGS || 'https://api.liontvplus.com/sales/catalogs' }}
      VITE_API_LIONTV: ${{ secrets.VITE_API_LIONTV || vars.VITE_API_LIONTV || 'https://api.liontvplus.com/sales/panel-lion-tv' }}
      VITE_API_SAGA: ${{ secrets.VITE_API_SAGA || vars.VITE_API_SAGA || 'https://api.liontvplus.com/sales/event-bus' }}
      VITE_API_SMS: ${{ secrets.VITE_API_SMS || vars.VITE_API_SMS || 'https://api.liontvplus.com/sales/sms' }}
      VITE_API_SHOPIFY_DEMOS: ${{ 'https://api.liontvplus.com/sales/demos' }}
      VITE_GOOGLE_CLIENT_ID: ${{ secrets.VITE_GOOGLE_CLIENT_ID || vars.VITE_GOOGLE_CLIENT_ID || '881879419726-dviv75rgbqofnh33288jr5loriie72ot.apps.googleusercontent.com' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./${{ env.APP_PATH }}
          file: ./${{ env.APP_PATH }}/Dockerfile
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            VITE_APP_VERSION=${{ github.ref_name }}
            VITE_APP_BASE_NAME=${{ env.VITE_APP_BASE_NAME }}
            VITE_API_AUTH=${{ env.VITE_API_AUTH }}
            VITE_API_USERS=${{ env.VITE_API_USERS }}
            VITE_API_PRODUCTS=${{ env.VITE_API_PRODUCTS }}
            VITE_API_RESERVATIONS=${{ env.VITE_API_RESERVATIONS }}
            VITE_API_SMS=${{ env.VITE_API_SMS }}
            VITE_API_CATALOGS=${{ env.VITE_API_CATALOGS }}
            VITE_API_LIONTV=${{ env.VITE_API_LIONTV }}
            VITE_API_SAGA=${{ env.VITE_API_SAGA }}
            VITE_GOOGLE_CLIENT_ID=${{ env.VITE_GOOGLE_CLIENT_ID }}
