name: Docker image

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  APP_PATH: berry-free-react-admin-template-main/vite

jobs:
  docker:
    name: Build & publish image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./${{ env.APP_PATH }}
          file: ./${{ env.APP_PATH }}/Dockerfile
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            VITE_APP_VERSION=${{ github.ref_name }}
            VITE_APP_BASE_NAME=${{ vars.VITE_APP_BASE_NAME || '/liontvpremium' }}
            VITE_API_AUTH=${{ secrets.VITE_API_AUTH || vars.VITE_API_AUTH || 'http://192.168.1.150:30100/' }}
            VITE_API_USERS=${{ secrets.VITE_API_USERS || vars.VITE_API_USERS || 'http://192.168.1.150:8082/v1' }}
            VITE_API_PRODUCTS=${{ secrets.VITE_API_PRODUCTS || vars.VITE_API_PRODUCTS || 'http://192.168.1.150:8083/v1' }}
            VITE_API_RESERVATIONS=${{ secrets.VITE_API_RESERVATIONS || vars.VITE_API_RESERVATIONS || 'http://192.168.1.150:8084/v1' }}
            VITE_API_SMS=${{ secrets.VITE_API_SMS || vars.VITE_API_SMS || '' }}
            VITE_API_CATALOGS=${{ secrets.VITE_API_CATALOGS || vars.VITE_API_CATALOGS || 'http://192.168.1.150:30104' }}
            VITE_API_LIONTV=${{ secrets.VITE_API_LIONTV || vars.VITE_API_LIONTV || 'http://192.168.1.150:30102' }}
            VITE_API_SAGA=${{ secrets.VITE_API_SAGA || vars.VITE_API_SAGA || 'http://192.168.1.150:30110' }}
            VITE_GOOGLE_CLIENT_ID=${{ secrets.VITE_GOOGLE_CLIENT_ID || vars.VITE_GOOGLE_CLIENT_ID || '881879419726-dviv75rgbqofnh33288jr5loriie72ot.apps.googleusercontent.com' }}
